<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema</title>
    <!-- Caminho atualizado para a pasta static/css -->
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>

    <form id="cadastroForm">
        <h1>Novo Cadastro</h1>
        
        <label for="cadNome">Nome Completo</label>
        <input type="text" id="cadNome" name="cadNome" required placeholder="Seu nome completo">

        <label for="cadEmail">E-mail</label>
        <input type="email" id="cadEmail" name="cadEmail" required placeholder="seu@email.com">
        
        <label for="cadSenha">Senha</label>
        <input type="password" id="cadSenha" name="cadSenha" required placeholder="Mínimo 6 caracteres">

        <label for="cadPerfil">Tipo de Usuário (select)</label>
        <select id="cadPerfil" name="cadPerfil" required>
            <option value="">Selecione...</option>
            <option value="estudante">Estudante</option>
            <option value="profissional">Profissional</option>
        </select>

        <span id="cadastroErrorMsg" class="error-msg">Preencha todos os campos corretamente.</span>
        
        <button type="submit">Cadastrar</button>

        <div class="form-links" style="margin-top: 15px; text-align: center;">
            <a href="perfil.html">Já tem uma conta? Faça login</a>
        </div>
    </form>

    <!-- Caminho atualizado para a pasta static/js -->
    <script src="static/js/main.js"></script>
</body>
</html>
