<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Perfil - Sistema</title>
    <!-- Caminho atualizado para a pasta static/css -->
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>

    <div class="container-principal">
        <!-- Tela de Login solicitada na atividade -->
        <form id="loginForm">
            <h1>Acessar Sistema</h1>
            
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
            
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Sua senha">

            <span id="errorMsg" class="error-msg">Preencha todos os campos corretamente.</span>
            
            <button type="submit">Entrar</button>

            <div class="form-links">
                <a href="#" id="linkCadastro">Criar conta</a>
                <a href="#" id="linkRecuperar">Esqueci a senha</a>
            </div>
        </form>

        <!-- Seção de Perfil com Elementos Avançados -->
        <div class="profile-card profile-extended" id="perfilContainer" style="display: none;">
            <h1>Configuração de Perfil</h1>
            <p>E-mail conectado: <strong id="userEmail">Carregando...</strong></p>

            <form id="perfilForm">
                <!-- Caixa de listagem Dropdown (select) -->
                <label for="cargo">Cargo / Função (select)</label>
                <select id="cargo" name="cargo" required>
                    <option value="">Selecione...</option>
                    <option value="desenvolvedor">Desenvolvedor Front-End/Back-End</option>
                    <option value="designer">Designer UI/UX</option>
                    <option value="suporte">Analista de Suporte / TI</option>
                </select>

                <!-- Botões de Rádio (radio) -->
                <label>Nível de Experiência (radio)</label>
                <div class="radio-group">
                    <label><input type="radio" name="experiencia" value="junior" required> Júnior</label>
                    <label><input type="radio" name="experiencia" value="pleno"> Pleno</label>
                    <label><input type="radio" name="experiencia" value="senior"> Sênior</label>
                </div>

                <!-- Caixas de seleção (checkbox) -->
                <label>Tecnologias de Domínio (checkbox)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="tech" value="html"> HTML5/CSS3</label>
                    <label><input type="checkbox" name="tech" value="js"> JavaScript</label>
                    <label><input type="checkbox" name="tech" value="sql"> Bancos de Dados</label>
                </div>

                <!-- Campos de texto extensos (textarea) -->
                <label for="biografia">Biografia / Resumo (textarea)</label>
                <textarea id="biografia" name="biografia" rows="3" placeholder="Escreva um breve resumo..."></textarea>

                <span id="perfilErrorMsg" class="error-msg">Preencha os campos obrigatórios.</span>

                <button type="submit">Salvar Alterações</button>
            </form>

            <button id="btnLogout" style="margin-top: 15px;">Sair (Logout)</button>
        </div>
    </div>

    <!-- Caminho atualizado para a pasta static/js -->
    <script src="static/js/main.js"></script>
</body>
</html>
