<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome">
        <button type="button" id="btn" onclick="habilitar()">Habilitar</button>
    </form>

    <script>
        function habilitar(){
            const txtNome = document.getElementById('nome');
            txtNome.value = "Astrogildo Tangolio";
        }
    </script>
</body>
</html>
